name: ULT dependency qualification
on:
  push:
    branches: [qa/dependency-qualification-1.1.0]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Hash-locked wheels and isolated install
        run: |
          mkdir -p qualification/wheelhouse
          python -m pip --isolated download --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r qa-dependencies/requirements.txt -d qualification/wheelhouse
          sha256sum qualification/wheelhouse/* | tee qualification/wheel-hashes.txt
          python -m venv .qualify
          .qualify/bin/python -m pip --isolated install --no-index --find-links qualification/wheelhouse --require-hashes --only-binary=:all: -r qa-dependencies/requirements.txt
          .qualify/bin/python -m pip check
          .qualify/bin/python -m pip list --format=json > qualification/installed.json
          .qualify/bin/python -c 'from rpds import HashTrieMap; from jsonschema import Draft202012Validator; assert HashTrieMap({"ok":1})["ok"]==1; Draft202012Validator({"type":"integer"}).validate(1)'
      - name: Inspect native binary
        run: |
          set -o pipefail
          find .qualify -path '*/rpds/*.so' -exec sha256sum {} \; > qualification/native-sha256.txt
          find .qualify -path '*/rpds/*.so' -exec strings {} \; > qualification/native-strings.txt
          grep -Eo '(pyo3|archery|triomphe|rpds)-[0-9]+\.[0-9]+\.[0-9]+' qualification/native-strings.txt | sort -u | tee qualification/native-versions.txt
      - name: OSV query for Python and upstream Rust lock
        run: .qualify/bin/python qa-dependencies/scan.py
      - name: Verify bytes and embedded SBOMs for every approved wheel
        run: .qualify/bin/python qa-dependencies/all_wheels.py
      - name: Independent Python advisory audit
        run: |
          python -m venv .audit
          .audit/bin/python -m pip --isolated install --index-url https://pypi.org/simple pip-audit==2.10.1
          .audit/bin/pip-audit --version | tee qualification/pip-audit-version.txt
          grep '==' qa-dependencies/requirements.txt | cut -d' ' -f1 > qualification/python-pins.txt
          .audit/bin/pip-audit --strict --no-deps --disable-pip --vulnerability-service pypi -r qualification/python-pins.txt --format json --output qualification/pip-audit.json
      - name: Independent RustSec audit
        run: |
          curl --fail --silent --show-error --location 'https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-gnu-v0.23.0.tgz' -o cargo-audit.tgz
          echo 'b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59  cargo-audit.tgz' | sha256sum --check
          mkdir -p .rust-audit
          tar -xzf cargo-audit.tgz -C .rust-audit
          AUDIT="$(find .rust-audit -type f -name cargo-audit | head -n 1)"
          test -n "$AUDIT"
          "$AUDIT" audit --version | tee qualification/cargo-audit-version.txt
          git clone --depth 1 https://github.com/RustSec/advisory-db.git .rustsec-db
          git -C .rustsec-db log -1 --format='%H %cI' > qualification/rustsec-db-revision.txt
          "$AUDIT" audit --file qualification/rpds-Cargo.lock --db .rustsec-db --no-fetch --json > qualification/cargo-audit.json
      - name: Upload public dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-qualification
          path: qualification/
          retention-days: 7
          if-no-files-found: error
